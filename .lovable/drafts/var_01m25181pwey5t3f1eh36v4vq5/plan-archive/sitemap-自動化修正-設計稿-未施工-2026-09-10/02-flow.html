<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Sitemap 產生流程 現況與修正後">
<style>
text{font-family:var(--font-sans);fill:hsl(var(--foreground))}
.s{font-size:12px;fill:hsl(var(--muted-foreground))}
.b{font-size:14px;font-weight:480}
.m{font-family:var(--font-mono);font-size:12px;fill:hsl(var(--muted-foreground))}
rect{fill:none;stroke:hsl(var(--muted-foreground));stroke-width:1}
line,path{stroke:hsl(var(--muted-foreground));stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L8 4 L0 8" stroke="hsl(var(--muted-foreground))" fill="none"/></marker></defs>

<text x="0" y="14" class="s">現況</text>
<rect x="0" y="26" width="130" height="44" rx="8"/><text x="65" y="53" class="b" text-anchor="middle">prebuild 腳本</text>
<line x1="130" y1="48" x2="182" y2="48" marker-end="url(#a)"/>
<rect x="184" y="26" width="150" height="44" rx="8"/><text x="259" y="46" class="b" text-anchor="middle">讀不到連線設定</text><text x="259" y="62" class="s" text-anchor="middle">回傳空清單</text>
<line x1="334" y1="48" x2="386" y2="48" marker-end="url(#a)"/>
<rect x="388" y="26" width="150" height="44" rx="8"/><text x="463" y="46" class="b" text-anchor="middle">照常覆蓋檔案</text><text x="463" y="62" class="s" text-anchor="middle">只剩 1 筆</text>

<line x1="0" y1="100" x2="640" y2="100" stroke="hsl(var(--border))"/>

<text x="0" y="130" class="s">修正後</text>
<rect x="0" y="142" width="130" height="44" rx="8"/><text x="65" y="163" class="b" text-anchor="middle">建置外掛</text><text x="65" y="179" class="s" text-anchor="middle">沿用網站設定</text>
<line x1="130" y1="164" x2="182" y2="164" marker-end="url(#a)"/>
<rect x="184" y="142" width="150" height="44" rx="8"/><text x="259" y="169" class="b" text-anchor="middle">撈到 13 間館別</text>
<line x1="334" y1="164" x2="386" y2="164" marker-end="url(#a)"/>
<rect x="388" y="142" width="220" height="44" rx="8" fill="hsl(var(--accent))" stroke="hsl(var(--accent))"/>
<text x="498" y="163" class="b" text-anchor="middle" fill="hsl(var(--accent-foreground))">寫出完整 sitemap</text>
<text x="498" y="179" style="font-size:12px" text-anchor="middle" fill="hsl(var(--accent-foreground))">館別頁 weekly / 0.8</text>

<path d="M259 186 L259 226" marker-end="url(#a)" stroke-dasharray="4 3"/>
<rect x="150" y="228" width="220" height="46" rx="8" stroke-dasharray="4 3"/>
<text x="260" y="248" class="b" text-anchor="middle">撈不到時</text>
<text x="260" y="264" class="s" text-anchor="middle">保留既有檔案 + 建置警告</text>
</svg>
