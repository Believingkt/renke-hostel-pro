<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; rx: 8; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; rx: 8; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="30" width="130" height="52"/>
  <text class="lbl" x="75" y="52" text-anchor="middle">建單送出</text>
  <text class="sm" x="75" y="70" text-anchor="middle">非豁免來源</text>

  <rect class="box" x="175" y="30" width="150" height="52"/>
  <text class="lbl" x="250" y="52" text-anchor="middle">逐晚取價</text>
  <text class="sm" x="250" y="70" text-anchor="middle">方案價 → 庫存價 → 底價</text>

  <line class="wire" x1="140" y1="56" x2="172" y2="56" marker-end="url(#a)"/>
  <line class="wire" x1="325" y1="56" x2="360" y2="56" marker-end="url(#a)"/>

  <rect class="box" x="360" y="30" width="130" height="52"/>
  <text class="lbl" x="425" y="60" text-anchor="middle">價格 &gt; 0 ?</text>

  <line class="wire" x1="490" y1="56" x2="525" y2="56" marker-end="url(#a)"/>
  <rect class="box" x="525" y="30" width="105" height="52"/>
  <text class="lbl" x="577" y="52" text-anchor="middle">正常建單</text>
  <text class="sm" x="577" y="70" text-anchor="middle">是</text>

  <line class="wire" x1="425" y1="82" x2="425" y2="150" marker-end="url(#a)"/>
  <text class="sm" x="435" y="120">否</text>

  <rect class="acc" x="300" y="150" width="250" height="66"/>
  <text class="lbl" x="425" y="176" text-anchor="middle" fill="hsl(var(--accent-foreground))">擋下建單並報錯</text>
  <text class="sm" x="425" y="196" text-anchor="middle">「11/28 找不到房價…請選擇方案」</text>

  <rect class="box" x="30" y="150" width="230" height="66" stroke-dasharray="4 3"/>
  <text class="lbl" x="145" y="176" text-anchor="middle">現況（要移除）</text>
  <text class="sm" x="145" y="196" text-anchor="middle">靜默寫入總額 0，訂金檢查誤報上限 0</text>
</svg>
