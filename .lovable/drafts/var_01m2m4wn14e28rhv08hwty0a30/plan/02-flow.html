<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: var(--fg-primary); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: var(--fg-secondary); }
    .box { fill: none; stroke: var(--fg-secondary); stroke-width: 1; rx: 8; }
    .fillq { fill: var(--bg-muted); stroke: none; rx: 8; }
    .acc { fill: var(--bg-accent-translucent); stroke: var(--fg-accent); stroke-width: 1; rx: 8; }
    .wire { stroke: var(--fg-secondary); stroke-width: 1; fill: none; }
    .zone { fill: none; stroke: var(--border-translucent); stroke-dasharray: 4 3; rx: 8; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="var(--fg-secondary)"/>
    </marker>
  </defs>

  <rect class="box" x="8" y="24" width="150" height="60"/>
  <text class="lbl" x="83" y="49" text-anchor="middle">新增月份</text>
  <text class="sm" x="83" y="69" text-anchor="middle">填課程盈餘</text>

  <rect class="acc" x="196" y="24" width="180" height="60"/>
  <text class="lbl" x="286" y="49" text-anchor="middle">分配方式：手動</text>
  <text class="sm" x="286" y="69" text-anchor="middle">新月份預設</text>

  <rect class="box" x="414" y="24" width="218" height="60"/>
  <text class="lbl" x="523" y="49" text-anchor="middle">帶入上個月名單</text>
  <text class="sm" x="523" y="69" text-anchor="middle">人員＋金額草稿，可改</text>

  <line class="wire" x1="158" y1="54" x2="190" y2="54" marker-end="url(#a)"/>
  <line class="wire" x1="376" y1="54" x2="408" y2="54" marker-end="url(#a)"/>

  <rect class="zone" x="8" y="108" width="624" height="132"/>
  <text class="sm" x="20" y="126">當期名單</text>

  <rect class="fillq" x="24" y="138" width="592" height="26"/>
  <text class="sm" x="40" y="155">姓名</text>
  <text class="sm" x="300" y="155">金額</text>
  <text class="sm" x="450" y="155">備註</text>

  <rect class="box" x="24" y="170" width="592" height="26"/>
  <text class="sm" x="40" y="187">成員 A</text>
  <text class="sm" x="300" y="187">12,000</text>

  <rect class="box" x="24" y="202" width="592" height="26"/>
  <text class="sm" x="40" y="219">成員 B</text>
  <text class="sm" x="300" y="219">8,000</text>

  <rect class="box" x="8" y="258" width="300" height="56"/>
  <text class="lbl" x="158" y="281" text-anchor="middle">合計 vs 當月盈餘</text>
  <text class="sm" x="158" y="301" text-anchor="middle">差額只提示，不阻擋</text>

  <rect class="box" x="332" y="258" width="300" height="56"/>
  <text class="lbl" x="482" y="281" text-anchor="middle">標記已發放後鎖定</text>
  <text class="sm" x="482" y="301" text-anchor="middle">名單與金額不可再改</text>

  <line class="wire" x1="308" y1="286" x2="326" y2="286" marker-end="url(#a)"/>
</svg>
