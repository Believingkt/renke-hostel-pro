<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>人客多 系統維護中</title>
<style>
  :root{--bg:#faf7f2;--fg:#2d3344;--accent:#d07218;--muted:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;padding:24px}
  .card{max-width:520px;width:100%;background:#fff;border-radius:16px;padding:40px 32px;box-shadow:0 8px 32px rgba(45,51,68,.08);text-align:center}
  .logo{font-weight:800;font-size:22px;letter-spacing:.04em;color:var(--accent);margin-bottom:24px}
  h1{font-size:22px;margin:0 0 12px}
  p{margin:0 0 10px;line-height:1.7;color:var(--muted);font-size:15px}
  .time{display:inline-block;margin:12px 0 4px;padding:8px 16px;border-radius:999px;background:#fff4e8;color:var(--accent);font-weight:600}
  .foot{margin-top:24px;font-size:13px;color:#9ca3af}
</style>
</head>
<body>
  <main class="card">
    <div class="logo">Lakeze 人客多</div>
    <h1>系統維護中，請稍後再試</h1>
    <p>我們正在進行系統升級，訂房、會員與後台功能暫時無法使用。</p>
    <div class="time">預計恢復時間：凌晨 02:00 前</div>
    <p>已完成的訂單與付款不受影響。若有緊急需求，請透過各民宿的 LINE 官方帳號或電話與我們聯繫。</p>
    <p class="foot">維護完成後本頁會自動恢復，造成不便敬請見諒。</p>
  </main>
  <script>setTimeout(function(){location.reload()},120000)</script>
</body>
</html>
