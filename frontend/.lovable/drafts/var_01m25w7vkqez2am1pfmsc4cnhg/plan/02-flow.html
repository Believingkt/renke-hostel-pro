<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .sm { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; rx: 8; }
    .wire { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .acc { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; rx: 8; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="hsl(var(--muted-foreground))"/>
    </marker>
  </defs>

  <text class="lbl" x="10" y="20">每一晚：判斷「價格是哪裡來的」，不看數字大小</text>

  <rect class="box" x="10" y="40" width="150" height="54"/>
  <text class="lbl" x="85" y="62" text-anchor="middle">有方案？</text>
  <text class="sm" x="85" y="80" text-anchor="middle">方案分級價／方案售價</text>

  <rect class="box" x="10" y="112" width="150" height="54"/>
  <text class="lbl" x="85" y="134" text-anchor="middle">庫存日曆有登記價？</text>
  <text class="sm" x="85" y="152" text-anchor="middle">欄位不是 NULL</text>

  <rect class="box" x="10" y="184" width="150" height="54"/>
  <text class="lbl" x="85" y="206" text-anchor="middle">退回房型底價</text>
  <text class="sm" x="85" y="224" text-anchor="middle">base_price</text>

  <line class="wire" x1="85" y1="94" x2="85" y2="110" marker-end="url(#a)"/>
  <line class="wire" x1="85" y1="166" x2="85" y2="182" marker-end="url(#a)"/>

  <line class="wire" x1="160" y1="67" x2="330" y2="67" marker-end="url(#a)"/>
  <line class="wire" x1="160" y1="139" x2="330" y2="139" marker-end="url(#a)"/>
  <line class="wire" x1="160" y1="211" x2="330" y2="211" marker-end="url(#a)"/>

  <rect class="box" x="330" y="40" width="300" height="54"/>
  <text class="lbl" x="480" y="62" text-anchor="middle">有明確售價 → 放行</text>
  <text class="sm" x="480" y="80" text-anchor="middle">取不到分級價與售價才擋下</text>

  <rect class="box" x="330" y="112" width="300" height="54"/>
  <text class="lbl" x="480" y="134" text-anchor="middle">放行，含登記 0 元招待房</text>
  <text class="sm" x="480" y="152" text-anchor="middle">0 是人為登記，不是查無資料</text>

  <rect class="acc" x="330" y="184" width="300" height="80"/>
  <text class="lbl" x="480" y="208" text-anchor="middle" fill="hsl(var(--accent-foreground))">包棟房型／底價未設定 → 擋下</text>
  <text class="sm" x="480" y="228" text-anchor="middle">is_exclusive_package = true 或 base_price IS NULL</text>
  <text class="sm" x="480" y="246" text-anchor="middle">一般房型底價明確為 0 則放行</text>

  <text class="sm" x="10" y="292">收尾保險：以「有幾晚沒取到明確價格」判斷，不再看總額是不是 0</text>
</svg>
