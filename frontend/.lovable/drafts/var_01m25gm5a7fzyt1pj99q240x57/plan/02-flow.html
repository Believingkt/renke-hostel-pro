<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }

  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7" fill="none" stroke="hsl(var(--muted-foreground))"/>
    </marker>
  </defs>

  <rect class="b" x="10" y="20" width="180" height="52"/>
  <text x="100" y="43" text-anchor="middle">變更訂單狀態</text>
  <text class="s" x="100" y="61" text-anchor="middle">訂單列表 / 詳情內嵌編輯</text>

  <text class="s" x="320" y="61" text-anchor="middle">團購？信用卡？</text>

  <text x="540" y="168" text-anchor="middle">信用卡訂單</text>
  <text class="s" x="540" y="185" text-anchor="middle">改走訂單詳情「取消訂單」</text>
  <text class="s" x="540" y="199" text-anchor="middle">原卡退刷＋取消信</text>

  <line class="w" x1="400" y1="40" x2="448" y2="23" marker-end="url(#a)"/>
  <line class="w" x1="400" y1="50" x2="448" y2="92" marker-end="url(#a)"/>
  <line class="w" x1="400" y1="56" x2="448" y2="172" marker-end="url(#a)"/>

  <text class="s" x="320" y="261" text-anchor="middle">不論從哪裡呼叫，違規改成已取消一律擋下</text>
  <line class="w" x1="320" y1="74" x2="320" y2="218" marker-end="url(#a)" stroke-dasharray="4 3"/>
</svg>
