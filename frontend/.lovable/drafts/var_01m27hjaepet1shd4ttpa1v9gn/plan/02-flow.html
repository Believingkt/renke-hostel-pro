<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .t { font-family: var(--font-sans); font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .l { font-family: var(--font-sans); font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .m { font-family: var(--font-mono); font-size: 11px; fill: hsl(var(--muted-foreground)); }
    .b { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .w { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; }
    .a { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="hsl(var(--muted-foreground))"/>
    </marker>
  </defs>

  <rect class="b" x="10" y="30" width="130" height="52" rx="8"/>
  <text class="l" x="75" y="52" text-anchor="middle">建立訂單</text>
  <text class="t" x="75" y="70" text-anchor="middle">寄 booking_pending</text>

  <rect class="b" x="180" y="30" width="130" height="52" rx="8"/>
  <text class="l" x="245" y="52" text-anchor="middle">開立虛擬帳號</text>
  <text class="m" x="245" y="70" text-anchor="middle">atm_created</text>

  <rect class="a" x="350" y="30" width="150" height="52" rx="8" stroke-dasharray="4 3"/>
  <text class="l" x="425" y="52" text-anchor="middle" fill="hsl(var(--accent))">缺口：無通知</text>
  <text class="t" x="425" y="70" text-anchor="middle">帳號只在網頁上看得到</text>

  <rect class="b" x="530" y="30" width="100" height="52" rx="8"/>
  <text class="l" x="580" y="52" text-anchor="middle">客人匯款</text>
  <text class="t" x="580" y="70" text-anchor="middle">deposit_received</text>

  <line class="w" x1="142" y1="56" x2="176" y2="56" marker-end="url(#ar)"/>
  <line class="w" x1="312" y1="56" x2="346" y2="56" marker-end="url(#ar)"/>
  <line class="w" x1="502" y1="56" x2="526" y2="56" marker-end="url(#ar)"/>

  <text class="t" x="10" y="112">信件內容判斷（改後）</text>
  <line class="b" x1="10" y1="122" x2="630" y2="122"/>

  <rect class="b" x="10" y="140" width="180" height="120" rx="8"/>
  <text class="l" x="100" y="164" text-anchor="middle">訂單付款方式</text>
  <text class="m" x="100" y="186" text-anchor="middle">orders.payment_method</text>
  <text class="m" x="100" y="204" text-anchor="middle">orders.atm_vacc_no</text>
  <text class="t" x="100" y="228" text-anchor="middle">＋活動 enable_bank_transfer</text>
  <text class="t" x="100" y="246" text-anchor="middle">（雙重確認）</text>

  <rect class="a" x="240" y="140" width="180" height="52" rx="8"/>
  <text class="l" x="330" y="162" text-anchor="middle">ATM／信用卡訂單</text>
  <text class="t" x="330" y="180" text-anchor="middle">不顯示共用匯款帳號</text>

  <rect class="b" x="240" y="208" width="180" height="52" rx="8"/>
  <text class="l" x="330" y="230" text-anchor="middle">人工匯款訂單</text>
  <text class="t" x="330" y="248" text-anchor="middle">照舊顯示共用帳號</text>

  <rect class="b" x="460" y="140" width="170" height="52" rx="8"/>
  <text class="l" x="545" y="162" text-anchor="middle">顯示虛擬帳號</text>
  <text class="m" x="545" y="180" text-anchor="middle">atm_vacc_no + 期限</text>

  <rect class="b" x="460" y="208" width="170" height="52" rx="8" stroke-dasharray="4 3"/>
  <text class="l" x="545" y="230" text-anchor="middle">尚未配發時</text>
  <text class="t" x="545" y="248" text-anchor="middle">「將由客服另行提供」</text>

  <line class="w" x1="192" y1="176" x2="236" y2="170" marker-end="url(#ar)"/>
  <line class="w" x1="192" y1="220" x2="236" y2="230" marker-end="url(#ar)"/>
  <line class="w" x1="422" y1="166" x2="456" y2="166" marker-end="url(#ar)"/>
  <line class="w" x1="422" y1="180" x2="456" y2="228" marker-end="url(#ar)"/>
</svg>
