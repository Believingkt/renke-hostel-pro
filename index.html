<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>森山寫照 - 山間的寧靜時光</title>
    
    <!-- Preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://dmafqwfynatdvnaeovhz.supabase.co">
    
    <!-- 預載入關鍵字體 - 確保字體在渲染前完全載入 -->
    <link rel="preload" href="https://fonts.gstatic.com/s/notosanstc/v35/-nFlOG829Oofr2wohFbTp9i9kwMUK_G-5DONY3ahGxvbItqP5Q.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.gstatic.com/s/notosanstc/v35/-nF8OG829Oofr2wohFbTp9i9kwMUK_G-5DDNY-avGxvbItqP5Vvv2A.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- 优化字体加载 - 使用 font-display: optional 配合預載入 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=optional" rel="stylesheet">
    
    <meta name="description" content="森山寫照位於寧靜的山區，是一處結合日式傳統美學與現代舒適的精品旅宿" />
    <meta name="author" content="森山寫照" />

    <meta property="og:title" content="森山寫照 - 山間的寧靜時光" />
    <meta property="og:description" content="結合日式傳統美學與現代舒適的精品旅宿" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />
    
    <!-- Inline critical CSS for instant rendering -->
    <style>
      * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body { 
        margin: 0; 
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 400;
        line-height: 1.5;
      }
      #root { min-height: 100vh; opacity: 0; transition: opacity 0.1s; }
      #root.fonts-loaded { opacity: 1; }
      .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      /* Safari 性能优化 */
      img { transform: translateZ(0); -webkit-transform: translateZ(0); }
      * { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
      /* 確保標題字體一致性 - 固定字體粗細避免跳動 */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 700;
        line-height: 1.2;
      }
    </style>
    <script>
      // 字體載入檢測 - 確保字體完全載入後才顯示內容
      if ('fonts' in document) {
        Promise.all([
          document.fonts.load('700 1em "Noto Sans TC"'),
          document.fonts.load('400 1em "Noto Sans TC"')
        ]).then(() => {
          document.documentElement.classList.add('fonts-loaded');
          document.getElementById('root')?.classList.add('fonts-loaded');
        }).catch(() => {
          // 如果字體載入失敗，1秒後仍然顯示內容
          setTimeout(() => {
            document.getElementById('root')?.classList.add('fonts-loaded');
          }, 1000);
        });
      } else {
        // 不支援 Font Loading API 的瀏覽器，直接顯示
        document.getElementById('root')?.classList.add('fonts-loaded');
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
