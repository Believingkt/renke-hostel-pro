<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>森山寫照 - 山間的寧靜時光</title>
    
    <!-- DNS Prefetch & Preconnect for faster loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://dmafqwfynatdvnaeovhz.supabase.co">
    
    <!-- 預載入關鍵字體 - 高優先級載入 -->
    <link rel="preload" href="https://fonts.gstatic.com/s/notosanstc/v35/-nFlOG829Oofr2wohFbTp9i9kwMUK_G-5DONY3ahGxvbItqP5Q.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high">
    <link rel="preload" href="https://fonts.gstatic.com/s/notosanstc/v35/-nF8OG829Oofr2wohFbTp9i9kwMUK_G-5DDNY-avGxvbItqP5Vvv2A.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high">
    
    <!-- 优化字体加载 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=optional" rel="stylesheet">
    
    <meta name="description" content="森山寫照位於寧靜的山區，是一處結合日式傳統美學與現代舒適的精品旅宿" />
    <meta name="author" content="森山寫照" />

    <meta property="og:title" content="森山寫照 - 山間的寧靜時光" />
    <meta property="og:description" content="結合日式傳統美學與現代舒適的精品旅宿" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />
    
    <!-- Inline critical CSS for instant rendering -->
    <style>
      /* 重置與基礎樣式 */
      * { 
        -webkit-font-smoothing: antialiased; 
        -moz-osx-font-smoothing: grayscale;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      
      /* 設計系統 - 關鍵顏色變數 */
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --primary: 240 5.9% 10%;
        --primary-foreground: 0 0% 98%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --border: 240 5.9% 90%;
        --radius: 0.5rem;
      }
      
      /* 基礎佈局 */
      html { 
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      
      body { 
        margin: 0; 
        padding: 0;
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 400;
        line-height: 1.5;
        color: hsl(var(--foreground));
        background-color: hsl(var(--background));
      }
      
      /* 根元素載入狀態 */
      #root { 
        min-height: 100vh; 
        opacity: 0; 
        transition: opacity 0.15s ease-in;
      }
      #root.fonts-loaded { opacity: 1; }
      
      /* 載入動畫 */
      .loading { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh;
        color: hsl(var(--muted-foreground));
      }
      
      /* 標題字體一致性 */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 700;
        line-height: 1.2;
        margin: 0;
      }
      
      /* 圖片優化 */
      img { 
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        max-width: 100%;
        height: auto;
      }
      
      /* 連結基礎樣式 */
      a { 
        color: inherit; 
        text-decoration: none; 
      }
      
      /* 按鈕基礎樣式 */
      button {
        font-family: inherit;
        cursor: pointer;
      }
    </style>
    <script>
      // 字體載入檢測 - 確保字體完全載入後才顯示內容
      if ('fonts' in document) {
        Promise.all([
          document.fonts.load('700 1em "Noto Sans TC"'),
          document.fonts.load('400 1em "Noto Sans TC"')
        ]).then(() => {
          document.documentElement.classList.add('fonts-loaded');
          document.getElementById('root')?.classList.add('fonts-loaded');
        }).catch(() => {
          // 如果字體載入失敗，1秒後仍然顯示內容
          setTimeout(() => {
            document.getElementById('root')?.classList.add('fonts-loaded');
          }, 1000);
        });
      } else {
        // 不支援 Font Loading API 的瀏覽器，直接顯示
        document.getElementById('root')?.classList.add('fonts-loaded');
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
