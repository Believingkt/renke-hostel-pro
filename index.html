<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>森山寫照 - 山間的寧靜時光</title>
    
    <!-- DNS Prefetch & Preconnect for faster loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://dmafqwfynatdvnaeovhz.supabase.co">
    
    <!-- 預載入關鍵字體 - 高優先級載入 -->
    <link rel="preload" href="https://fonts.gstatic.com/s/notosanstc/v35/-nFlOG829Oofr2wohFbTp9i9kwMUK_G-5DONY3ahGxvbItqP5Q.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high">
    <link rel="preload" href="https://fonts.gstatic.com/s/notosanstc/v35/-nF8OG829Oofr2wohFbTp9i9kwMUK_G-5DDNY-avGxvbItqP5Vvv2A.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high">
    
    <!-- 优化字体加载 - 使用 block 避免文字閃爍 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=block" rel="stylesheet">
    
    <meta name="description" content="森山寫照位於寧靜的山區，是一處結合日式傳統美學與現代舒適的精品旅宿" />
    <meta name="author" content="森山寫照" />

    <meta property="og:title" content="森山寫照 - 山間的寧靜時光" />
    <meta property="og:description" content="結合日式傳統美學與現代舒適的精品旅宿" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />
    
    <!-- Inline critical CSS for instant rendering -->
    <style>
      /* 重置與基礎樣式 */
      * { 
        -webkit-font-smoothing: antialiased; 
        -moz-osx-font-smoothing: grayscale;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      
      /* 設計系統 - 關鍵顏色變數 */
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --primary: 240 5.9% 10%;
        --primary-foreground: 0 0% 98%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --border: 240 5.9% 90%;
        --radius: 0.5rem;
      }
      
      /* 基礎佈局 */
      html { 
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      
      body { 
        margin: 0; 
        padding: 0;
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-weight: 400;
        line-height: 1.5;
        color: hsl(var(--foreground));
        background-color: hsl(var(--background));
      }
      
      /* 根元素載入狀態 - 完全隱藏直到字體載入 */
      #root { 
        min-height: 100vh; 
        visibility: hidden;
        opacity: 0;
      }
      #root.fonts-loaded { 
        visibility: visible;
        opacity: 1;
      }
      
      /* 載入動畫 */
      .loading { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh;
        color: hsl(var(--muted-foreground));
      }
      
      /* 標題字體一致性 - 強制設定避免字體閃爍 */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Noto Sans TC', sans-serif !important;
        font-weight: 700 !important;
        line-height: 1.2;
        margin: 0;
        visibility: inherit;
      }
      
      /* 字體未載入時隱藏所有文字 */
      body:not(.fonts-loaded) h1,
      body:not(.fonts-loaded) h2,
      body:not(.fonts-loaded) h3,
      body:not(.fonts-loaded) p,
      body:not(.fonts-loaded) span,
      body:not(.fonts-loaded) div {
        visibility: hidden !important;
      }
      
      /* 圖片優化 */
      img { 
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        max-width: 100%;
        height: auto;
      }
      
      /* 連結基礎樣式 */
      a { 
        color: inherit; 
        text-decoration: none; 
      }
      
      /* 按鈕基礎樣式 */
      button {
        font-family: inherit;
        cursor: pointer;
      }
    </style>
    <script>
      // 字體載入檢測 - 完全確保字體載入後才顯示
      (function() {
        // 立即添加 loading 狀態到 body
        document.body.classList.remove('fonts-loaded');
        
        if ('fonts' in document) {
          // 等待所有字體資源下載完成
          document.fonts.ready.then(() => {
            // 強制載入所有關鍵字重
            return Promise.all([
              document.fonts.load('700 1em "Noto Sans TC"'),
              document.fonts.load('400 1em "Noto Sans TC"'),
              document.fonts.load('500 1em "Noto Sans TC"'),
              document.fonts.load('600 1em "Noto Sans TC"')
            ]);
          }).then(() => {
            // 等待三個渲染幀確保字體完全應用到 DOM
            return new Promise(resolve => {
              requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                  requestAnimationFrame(() => {
                    resolve();
                  });
                });
              });
            });
          }).then(() => {
            // 額外延遲確保所有元素都已用新字體渲染
            setTimeout(() => {
              document.body.classList.add('fonts-loaded');
              document.documentElement.classList.add('fonts-loaded');
              const root = document.getElementById('root');
              if (root) {
                root.classList.add('fonts-loaded');
              }
            }, 100);
          }).catch(() => {
            // 失敗時也要顯示內容
            setTimeout(() => {
              document.body.classList.add('fonts-loaded');
              document.getElementById('root')?.classList.add('fonts-loaded');
            }, 2000);
          });
        } else {
          // 不支援的瀏覽器
          setTimeout(() => {
            document.body.classList.add('fonts-loaded');
            document.getElementById('root')?.classList.add('fonts-loaded');
          }, 1500);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
