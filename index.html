    <!-- Inline critical CSS for instant rendering -->
    <style>
      /* 重置與基礎樣式 */
      * { 
        -webkit-font-smoothing: antialiased; 
        -moz-osx-font-smoothing: grayscale;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      
      /* 字體已由 Google Fonts 載入 */
      
      /* 首屏圖片立即顯示 - 無過渡 */
      .hero-first-image {
        opacity: 1 !important;
        transition: none !important;
      }
      
      /* Hero 標題固定樣式 - 避免閃爍 */
      .hero-title {
        font-size: clamp(1.875rem, 5vw, 5rem) !important;
        font-family: 'Noto Sans TC', sans-serif !important;
        font-weight: 700 !important;
        line-height: 1.2 !important;
      }
      
      /* 設計系統 - 關鍵顏色變數 */
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --primary: 240 5.9% 10%;
        --primary-foreground: 0 0% 98%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --border: 240 5.9% 90%;
        --radius: 0.5rem;
      }
      
      /* 基礎佈局 */
      html { 
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }
      
      body { 
        margin: 0; 
        padding: 0;
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 400;
        line-height: 1.5;
        color: hsl(var(--foreground));
        background-color: hsl(var(--background));
      }
      
      /* 根元素 */
      #root { 
        min-height: 100vh;
      }
      
      /* 載入動畫 */
      .loading { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh;
        color: hsl(var(--muted-foreground));
      }
      
      /* 標題字體 - 無後備 */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 700;
        line-height: 1.2;
        margin: 0;
      }
      
      /* 圖片優化 */
      img { 
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        max-width: 100%;
        height: auto;
      }
      
      /* 連結基礎樣式 */
      a { 
        color: inherit; 
        text-decoration: none; 
      }
      
      /* 按鈕基礎樣式 */
      button {
        font-family: inherit;
        cursor: pointer;
      }
    </style>

  <body>
    <div id="root"></div>
    <script>
      // 全域錯誤捕捉 - 防止空白頁
      window.onerror = function(msg, src, line, col, err) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:2rem;text-align:center;font-family:sans-serif">' +
            '<h2>載入失敗</h2>' +
            '<p style="color:#666">' + msg + '</p>' +
            '<p style="color:#999;font-size:12px">' + (src || '') + ':' + (line || '') + '</p>' +
            '<button onclick="location.reload()" style="margin-top:1rem;padding:8px 16px;cursor:pointer">重新整理</button>' +
            '</div>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
