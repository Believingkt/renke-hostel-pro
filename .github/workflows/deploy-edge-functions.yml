# 自動部署 Supabase Edge Functions（正式環境 opaphdargymfyrrzvozs）
#
# 觸發：
#   - push 到 production 分支（Emergent「人客多 - 主系統」Save to GitHub 一律存到這個分支），
#     且有改到 supabase/functions/** → 只部署有變動的 function（改 _shared 會連帶部署引用它的 function）
#   - 手動：Actions → Deploy Supabase Edge Functions → Run workflow，輸入 function 名稱
#
# 不會做的事：
#   - 不跑資料庫 migration（supabase/migrations 有變動只會出警告，請 Nokimi 審過再手動上）
#   - 不刪除線上 function
#
# 需要的設定（GitHub repo → Settings）：
#   - Secrets and variables → Actions → SUPABASE_ACCESS_TOKEN（Supabase 個人 access token，不要放進 Emergent）
#   （私有 repo 在 GitHub Free 方案無法使用 Environments／部署核准，因此不設 environment）
name: Deploy Supabase Edge Functions
on:
  push:
    branches: [production]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      functions:
        description: "要部署的 function 名稱，空白分隔（例如：tappay-notify send-password-reset）"
        required: true
        type: string
concurrency:
  group: supabase-edge-functions-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: opaphdargymfyrrzvozs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 檢查 migration 是否有變動
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git diff --name-only "$BEFORE" "$AFTER" -- supabase/migrations supabase/config.toml | grep -q .; then
            echo "::warning::這次 push 有改到 supabase/migrations 或 config.toml，本流程不會套用，請 Nokimi 審核後手動處理。"
            git diff --name-only "$BEFORE" "$AFTER" -- supabase/migrations supabase/config.toml
          fi
      - name: 決定要部署的 function
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FUNCTIONS: ${{ inputs.functions }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            list="$INPUT_FUNCTIONS"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::無法取得前一個 commit（新分支或 force push），不自動部署；需要的話請用手動執行。"
            list=""
          else
            list="$(bash scripts/ci/changed-edge-functions.sh "$BEFORE" "$AFTER" | tr '\n' ' ')"
          fi
          valid=""
          for fn in $list; do
            if ! [[ "$fn" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
              echo "::error::function 名稱不合法：$fn"; exit 1
            fi
            if [ ! -f "supabase/functions/$fn/index.ts" ] && [ ! -f "supabase/functions/$fn/index.tsx" ]; then
              echo "::error::找不到 supabase/functions/$fn/index.ts"; exit 1
            fi
            valid="$valid $fn"
          done
          valid="$(echo $valid)"
          echo "functions=$valid" >> "$GITHUB_OUTPUT"
          if [ -z "$valid" ]; then
            echo "沒有需要部署的 function。" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo "### 將部署的 function"; for fn in $valid; do echo "- \`$fn\`"; done; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.pick.outputs.functions != ''
        with:
          version: 2.117.0
      - name: 部署
        if: steps.pick.outputs.functions != ''
        env:
          FUNCTIONS: ${{ steps.pick.outputs.functions }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::尚未設定 repo secret SUPABASE_ACCESS_TOKEN"; exit 1
          fi
          # verify_jwt 等設定依 supabase/config.toml
          supabase functions deploy $FUNCTIONS --project-ref "$PROJECT_REF"
          echo "已部署：$FUNCTIONS（commit ${GITHUB_SHA::9}）" >> "$GITHUB_STEP_SUMMARY"
